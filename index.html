<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sonalll ❤️</title>
    <style>
        :root { --pink: #ff85a2; --soft-pink: #ffc2d1; --white: #ffffff; }
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow-x: hidden; text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px);
            padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(255, 133, 162, 0.37); z-index: 10;
        }
        h1 { color: #d81b60; font-size: 3rem; margin-bottom: 10px; }
        .buttons { margin-top: 30px; position: relative; height: 100px; width: 100%; }
        button {
            padding: 15px 35px; font-size: 1.2rem; border: none; border-radius: 50px;
            cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        #yesBtn { background-color: var(--pink); color: white; box-shadow: 0 4px 15px rgba(255, 133, 162, 0.4); }
        #noBtn { background-color: #eee; color: #555; position: absolute; left: 50%; transform: translateX(50%); }
        .hidden { display: none; }
        #secretContent { margin-top: 30px; animation: fadeIn 2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        /* Floating Hearts Styling */
        .heart { position: fixed; color: var(--pink); top: -10%; font-size: 20px; animation: fall linear infinite; z-index: 1; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container" id="mainCard">
        <h1>Hey Sonalll... ❤️</h1>
        <p>I wanted to tell you something special.</p>
        <div class="buttons">
            <button id="yesBtn">Yes, Forever!</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div id="secretContent" class="hidden container">
        <h1>Yay! I Love You So Much! ❤️</h1>
        <p>You make every single day brighter, Sonalll. You are my world, my happiness, and my forever.</p>
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ3F5bzRreG04NDN4eHF5bm02Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6Z3B6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZNoSDAzNmNlYm05YQ/l4pTdcifPKUYMl3mE/giphy.gif" alt="Hearts" width="200">
        <p style="font-style: italic; margin-top: 20px;">"To the moon and back, always."</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainCard = document.getElementById('mainCard');
        const secretContent = document.getElementById('secretContent');

        // Running No Button Trick
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
            noBtn.style.position = 'fixed';
        });

        // Yes Button Action
        yesBtn.addEventListener('click', () => {
            mainCard.classList.add('hidden');
            secretContent.classList.remove('hidden');
            createConfetti();
        });

        // Floating Hearts Background
        function createHearts() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHearts, 300);
    </script>
</body>
</html>
